name: Foundation quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_build_example
      SITE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Check migration order
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000')
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-supabase/check-migration-order.mjs "$MIGRATION_BASE" HEAD
      - name: Activate pinned pnpm
        run: corepack enable
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install locked dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Scan repository history for secrets
        # gitleaks v8.30.1 OCI index, including the linux/amd64 runner image.
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner
      - name: Select available CI database port
        run: node scripts/ci-supabase/prepare-database-port.mjs
      - name: Start isolated local Supabase
        run: |
          if pnpm supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            exit 0
          else
            startup_status=$?
            # Preserve the failure while surfacing diagnostics without local credentials.
            sed -E \
              -e 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/[REDACTED_JWT]/g' \
              -e 's/sb_(secret|publishable)_[A-Za-z0-9_-]+/[REDACTED_KEY]/g' \
              -e 's#(postgres(ql)?://[^:/[:space:]]+:)[^@[:space:]]+@#\1[REDACTED]@#g' \
              "$RUNNER_TEMP/supabase-start.log" | tail -n 80
            exit "$startup_status"
          fi
      - run: pnpm supabase db reset
      - run: pnpm test:db
      - run: pnpm supabase db lint
      - run: pnpm db:types:check
      - run: pnpm test:draft-contract
      - run: pnpm test:draft-editor
      - run: pnpm test:draft-concurrency
      - name: Restore incremental Next.js cache
        id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Save Playwright browser cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      # Playwright builds once with its verified local public environment,
      # then starts that production artifact; build failure fails this step.
      - name: Production build and browser checks
        id: browser
        run: pnpm test:e2e
      - name: Upload failed browser results
        if: ${{ !cancelled() && steps.browser.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save incremental Next.js cache
        if: ${{ !cancelled() && steps.browser.outcome != 'skipped' && steps.next-cache.outputs.cache-hit != 'true' && hashFiles('.next/BUILD_ID') != '' && hashFiles('.next/cache/**') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
      - name: Scan production dependencies
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm audit --prod --audit-level=high
      - name: Scan all dependencies
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm audit --audit-level=high
      - name: Stop local services
        if: always()
        run: pnpm supabase stop --no-backup
